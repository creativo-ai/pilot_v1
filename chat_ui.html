<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creativo — Brand Onboarding Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --surface2: #f2f0ec;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
    --text: #1a1916; --text2: #6b6860; --text3: #9b9890;
    --accent: #2a5cf6; --accent-bg: #eef1fe; --accent-text: #1a3db8;
    --user-bubble: #2a5cf6; --user-text: #ffffff;
    --radius: 12px; --radius-sm: 8px;
    --font: 'DM Sans', -apple-system, sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  header { background: var(--surface); border-bottom: 0.5px solid var(--border2); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10; }
  .logo { font-weight: 600; font-size: 15px; color: var(--text); }
  .brand-pill { background: var(--accent-bg); color: var(--accent-text); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); max-width: 900px; margin: 0 auto; width: 100%; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  
  .msg-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .avatar.ai { background: var(--accent); color: white; }
  .avatar.user { background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border2); }
  
  .bubble { max-width: 75%; padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; }
  .bubble.ai { background: var(--surface); color: var(--text); border: 0.5px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.user { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bubble.ai p { margin-bottom: 8px; }
  .bubble.ai p:last-child { margin-bottom: 0; }
  
  /* Fields Banner */
  .fields-banner { margin: 0 24px; background: #eaf3de; border: 0.5px solid #97c459; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #3b6d11; display: none; align-items: flex-start; gap: 8px; }
  .fields-banner.visible { display: flex; }

  .input-area { background: var(--surface); border-top: 0.5px solid var(--border2); padding: 16px 24px; flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  
  textarea { flex: 1; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 14px; font-family: var(--font); font-size: 14px; resize: none; outline: none; min-height: 38px; max-height: 120px; }
  textarea:focus { border-color: var(--accent); }
  
  .icon-btn, .send-btn { width: 36px; height: 36px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn { background: var(--surface2); color: var(--text2); }
  .send-btn { background: var(--accent); color: white; border: none; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  #file-input { display: none; }
  .file-preview { display: none; align-items: center; gap: 8px; background: var(--accent-bg); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 10px; font-size: 13px; color: var(--accent-text); }
  .file-preview.visible { display: flex; }
</style>
</head>
<body>

<header>
  <div class="logo">Creativo Prototype</div>
  <div class="brand-pill" id="brand-label">Brand ID: test6</div>
</header>

<div class="chat-area">
  <div class="fields-banner" id="fields-banner"><span id="fields-banner-text"></span></div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="file-preview" id="file-preview">
      📄 <span id="file-name"></span>
      <button onclick="removeFile()" style="background:none;border:none;cursor:pointer;margin-left:auto;">❌</button>
    </div>
    <div class="input-row">
      <label class="icon-btn" for="file-input">📎</label>
      <input type="file" id="file-input" accept=".pdf,.docx,.txt" onchange="handleFile(event)">
      
      <textarea id="msg-input" placeholder="Message Lumio..." rows="1" onkeydown="handleKey(event)"></textarea>
      
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
// CHANGE THIS TO TEST DIFFERENT BRANDS (e.g. test5, test6)
const USER_ID  = "marmar";
const BRAND_ID = "test6";   
const API_URL  = "http://localhost:8001/chat";

document.getElementById("brand-label").textContent = `Brand ID: ${BRAND_ID}`;

let pendingFile = null;
let pendingFileText = null;
let conversationHistory = [];

function addMessage(role, text) {
  const msgs = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;
  const content = role === "user" ? escapeHtml(text) : renderMarkdown(text);
  row.innerHTML = `
    <div class="avatar ${role}">${role === "user" ? "U" : "AI"}</div>
    <div class="bubble ${role}">${content}</div>
  `;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderMarkdown(t) { return t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>"); }

function showFieldsBanner(fields) {
  const banner = document.getElementById("fields-banner");
  document.getElementById("fields-banner-text").textContent = `Extracted fields: ${fields.join(", ")}`;
  banner.classList.add("visible");
  setTimeout(() => banner.classList.remove("visible"), 5000);
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById("file-name").textContent = file.name;
  document.getElementById("file-preview").classList.add("visible");
  pendingFile = file.name;
  pendingFileText = file.name.endsWith(".txt") ? await file.text() : `[File: ${file.name}]`;
  event.target.value = "";
}

function removeFile() {
  pendingFile = null; pendingFileText = null;
  document.getElementById("file-preview").classList.remove("visible");
}

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const msgText = text || `Uploaded: ${pendingFile}`;
  addMessage("user", msgText);
  input.value = "";
  conversationHistory.push({ role: "user", content: msgText });

  const payload = {
    user_id: USER_ID, brand_id: BRAND_ID, message: msgText,
    history: conversationHistory.slice(-20), file_content: pendingFileText, file_name: pendingFile,
  };

  if (pendingFile) removeFile();

  try {
    const res = await fetch(API_URL, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    const data = await res.json();
    addMessage("ai", data.response || "Error responding.");
    conversationHistory.push({ role: "assistant", content: data.response });
    
    if (data.extracted_fields && data.extracted_fields.length > 0) {
      showFieldsBanner(data.extracted_fields);
    }
  } catch (err) {
    addMessage("ai", "Connection error.");
  }
}
</script>
</body>
</html>
